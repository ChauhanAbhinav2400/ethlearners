version: 1

applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node --version
            - npm --version
            # appRoot is frontend/ — go up one level to the repo root
            # where package.json and package-lock.json live
            - cd .. && npm ci
        build:
          commands:
            # Each phase restarts in appRoot (frontend/), so cd .. again
            - cd .. && npm run build -w @explorer/frontend
      artifacts:
        # Relative to appRoot (frontend/), so "dist" = frontend/dist
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - frontend/node_modules/**/*
    appRoot: frontend

version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm --version
        - npm ci
    build:
      commands:
        - npm run build -w @explorer/frontend
    postBuild:
      commands:
        - echo "Frontend build complete → frontend/dist"
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - frontend/node_modules/**/*

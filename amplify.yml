version: 1

applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node --version
            - npm --version
            # CODEBUILD_SRC_DIR is set by Amplify to the repo root directory.
            # Store it so every phase can reference it reliably.
            - export REPO_ROOT=$(pwd | sed 's|/frontend$||')
            - echo "Repo root is $REPO_ROOT"
            - ls "$REPO_ROOT/package.json"
            - cd "$REPO_ROOT" && npm ci
        build:
          commands:
            - export REPO_ROOT=$(pwd | sed 's|/frontend$||')
            - cd "$REPO_ROOT" && npm run build -w @explorer/frontend
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - frontend/node_modules/**/*
    appRoot: frontend

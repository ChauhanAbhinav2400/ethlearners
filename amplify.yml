version: 1

applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node --version
            - npm --version
            - cd .. && npm ci

        build:
          commands:
            - cd .. && npm run build -w @explorer/frontend

      artifacts:
        baseDirectory: dist
        files:
          - '**/*'

      cache:
        paths:
          - ../node_modules/**/*
          - node_modules/**/*